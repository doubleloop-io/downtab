name: Pages

on:
  push:
    branches: [main]
    paths:
      - website/**
      - .github/workflows/pages.yml
  # scripts/release-publish.sh dispatches it on main, so the page shows the new release's version; a release event
  # would run on the tag, which the github-pages environment refuses.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The page keeps its descriptive name in website/; Pages serves it as the site's index.
      - name: Stage site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site
          version=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          [[ $version =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected latest release tag: $version"; exit 1; }
          sed "s/DOWNTAB_VERSION/$version/g" website/downtab-landing.html > _site/index.html
          if grep -q DOWNTAB_VERSION _site/index.html; then echo "version placeholder left"; exit 1; fi
          cp website/downtab-demo.mp4 website/downtab-demo-cover.jpg website/downtab-og.jpg _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
