name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's default Xcode, not the local toolchain: no hosted runner ships Swift 6.4 / the macOS 27 SDK yet.
      - name: Versions
        run: |
          sw_vers
          uname -m
          xcode-select -p
          swift --version
      - name: Build
        run: make build
      - name: Test
        run: make test
