<!doctype html>
<!-- PROTOTYPE, throwaway. Question: how to go from app to window without friction and without moving the UI?
     Variants live on ?variant=A|B|C|D|E. Switch with keys 1-5 because arrows belong to the switcher. -->
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Downtab Prototype</title>
<style>
  :root {
    --glass: rgba(38, 38, 42, 0.86);
    --line: rgba(255, 255, 255, 0.13);
    --text: #f4f4f5;
    --muted: #a1a1aa;
    --accent: #0a84ff;
    --selected: rgba(255, 255, 255, 0.18);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #3b4a6b, #5f4b6e 55%, #2c3e50);
    color: var(--text);
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #stage { position: absolute; inset: 0; }
  .panel {
    position: absolute; top: 24vh; left: 50%; transform: translateX(-50%);
    max-width: 94vw;
    background: var(--glass); border: 1px solid var(--line); border-radius: 22px;
    backdrop-filter: blur(24px); box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
    padding: 12px;
  }
  .row { display: flex; gap: 4px; align-items: flex-start; }
  .tile {
    position: relative; width: 84px; height: 104px; flex: none; padding: 8px 4px 0;
    border-radius: 14px; text-align: center;
  }
  .tile.sel { background: var(--selected); }
  .tile.parent { background: rgba(255, 255, 255, 0.08); outline: 1px solid var(--line); }
  .icon {
    position: relative; width: 56px; height: 56px; margin: 0 auto; border-radius: 13px;
    display: grid; place-items: center; font-size: 25px; font-weight: 700; color: #fff;
  }
  .name { margin-top: 4px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dots { position: absolute; left: 0; right: 0; bottom: 3px; display: flex; gap: 3px; justify-content: center; }
  .dots i { width: 4px; height: 4px; border-radius: 50%; background: var(--text); }
  .badge {
    position: absolute; top: -5px; right: -6px; min-width: 19px; height: 19px; padding: 0 5px;
    border-radius: 10px; background: var(--accent); font-size: 11px; line-height: 19px; font-weight: 600;
  }
  .stacked::before, .stacked::after {
    content: ""; position: absolute; inset: 0; border-radius: 13px; background: inherit; z-index: -1;
  }
  .stacked::before { transform: translate(4px, -4px); opacity: 0.65; }
  .stacked::after { transform: translate(8px, -8px); opacity: 0.35; }
  .icon-wrap { isolation: isolate; }
  .chev { position: absolute; left: 0; right: 0; bottom: 1px; font-size: 10px; color: var(--muted); }

  .win {
    display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 9px;
    white-space: nowrap; flex: none;
  }
  .win .t { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .win .tag { font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; }
  .win.sel { background: var(--accent); }
  .win.sel .tag { color: #fff; border-color: rgba(255, 255, 255, 0.5); }

  .pop {
    position: absolute; width: 340px; padding: 6px; background: var(--glass);
    border: 1px solid var(--line); border-radius: 13px; backdrop-filter: blur(24px);
    box-shadow: 0 16px 44px rgba(0, 0, 0, 0.4); max-height: 262px; overflow: auto;
  }

  .pop.grid { width: 600px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .gcell { height: 72px; padding: 8px; border-radius: 9px; background: rgba(255, 255, 255, 0.07); font-size: 12px; overflow: hidden; }
  .gcell.sel { background: var(--accent); }
  .gtitle { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; margin-bottom: 3px; }
  .gcell .tag { font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 4px; }
  .gcell.sel .tag { color: #fff; border-color: rgba(255, 255, 255, 0.5); }

  .shelf { height: 188px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); overflow: auto; }
  .shelf .empty { color: var(--muted); padding: 10px; }
  .shelf.dim .win { opacity: 0.72; }

  .fixed-c { width: 760px; height: 170px; }
  .crumb { display: flex; align-items: center; gap: 8px; height: 24px; margin-bottom: 6px; color: var(--muted); }
  .crumb .icon { width: 22px; height: 22px; margin: 0; border-radius: 6px; font-size: 11px; }
  .cards { display: flex; gap: 8px; overflow-x: auto; padding: 2px; }
  .card { width: 148px; flex: none; padding: 6px; border-radius: 11px; }
  .card.sel { background: var(--accent); }
  .thumb { height: 76px; border-radius: 6px; background: linear-gradient(#52525b 13px, #27272a 13px); }
  .card .t { margin-top: 5px; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .expanded { display: flex; align-items: flex-start; gap: 4px; padding: 8px; border-radius: 14px; background: rgba(255, 255, 255, 0.08); flex: 0 1 auto; min-width: 0; overflow: hidden; }
  .expanded .icon { flex: none; }
  .chips { display: flex; gap: 4px; overflow: hidden; }
  .chip { width: 130px; height: 74px; flex: none; padding: 8px; border-radius: 9px; background: rgba(255, 255, 255, 0.07); font-size: 11px; overflow: hidden; }
  .chip.sel { background: var(--accent); }

  #hud {
    position: fixed; left: 16px; bottom: 16px; width: 300px; padding: 10px 12px; border-radius: 10px;
    background: #0b0b0d; color: #d4d4d8; font: 11px/1.5 ui-monospace, Menlo, monospace;
  }
  #hud b { color: #fff; font-weight: 600; }
  #hud .warn { color: #fbbf24; }
  #help {
    position: fixed; right: 16px; bottom: 16px; width: 290px; padding: 10px 12px; border-radius: 10px;
    background: #0b0b0d; color: #d4d4d8; font-size: 11px; line-height: 1.55;
  }
  #help b { color: #fff; }
  #bar {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px;
    padding: 6px 8px; border-radius: 999px; background: #facc15; color: #111; font-weight: 600; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    white-space: nowrap;
  }
  #bar button { border: 0; background: #111; color: #facc15; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 14px; }
  #hint { position: absolute; top: 24vh; left: 0; right: 0; text-align: center; font-size: 15px; text-shadow: 0 1px 6px rgba(0,0,0,.6); }
  #hint small { display: block; margin-top: 6px; font-size: 12px; opacity: 0.8; }

  @media (max-width: 1100px) { #help { display: none; } }
  @media (max-width: 760px) { #hud { display: none; } .fixed-c { width: 94vw; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud"></div>
<div id="help">
  <b>Tasti</b><br />
  <b>⌥ + Tab</b> apre; rilascio ⌥ conferma (come ⌘Tab)<br />
  <b>Tab</b> da solo apre in modalità fissa; <b>Enter</b> conferma<br />
  <b>⇧Tab</b> app precedente · <b>Esc</b> annulla<br />
  <b>← → ↑ ↓</b> navigano · <b>1-5</b> cambiano variante
</div>
<div id="bar">
  <button id="prev" aria-label="Variante precedente">‹</button>
  <span id="label"></span>
  <button id="next" aria-label="Variante successiva">›</button>
</div>

<script>
const VARIANTS = {
  A: "Tendina sotto l'icona",
  B: "Ripiano fisso sempre visibile",
  C: "Sostituzione sul posto",
  D: "Fisarmonica nella riga",
  E: "Griglia sotto l'icona",
};
const GRID_COLUMNS = 3;
const VARIANT_KEYS = Object.keys(VARIANTS);
const VERTICAL_WINDOW_LIST = new Set(["A", "B"]);

const seedApps = () => [
  { name: "VS Code", color: "#0a7bd6", windows: [
    { t: "app-ideas — prototype-ui-variants.html" }, { t: "fitview — CONTEXT.md" }, { t: "recipe-app — goal.md" },
    { t: "trail-running-races — arch-choices.md" }, { t: "dotfiles — .zshrc" },
    { t: "client-api — orders.service.ts" }, { t: "scratch — Untitled-4", tag: "minimizzata" },
  ]},
  { name: "Chrome", color: "#d9503f", windows: [
    { t: "GitHub — Pull requests assigned to me and a very long tab title that must be truncated" },
    { t: "intervals.icu — Calendar" }, { t: "Google Docs — Offerta Q4" },
  ]},
  { name: "Ghostty", color: "#3f3f46", windows: [{ t: "~/projects/iacoware" }, { t: "ssh staging" }] },
  { name: "Slack", color: "#611f69", windows: [{ t: "#general" }] },
  { name: "Figma", color: "#a259ff", windows: [{ t: "Switcher explorations" }, { t: "Design system" }] },
  { name: "Mail", color: "#1e90ff", windows: [{ t: "Posta in arrivo", tag: "minimizzata" }] },
  { name: "Spotify", color: "#1db954", windows: [{ t: "Spotify" }] },
  { name: "Finder", color: "#60a5fa", windows: [] },
];

const params = new URLSearchParams(location.search);
const s = {
  variant: VARIANT_KEYS.includes(params.get("variant")) ? params.get("variant") : "A",
  apps: seedApps(),
  open: false,
  level: "app",
  a: 0,
  w: 0,
  heldOption: false,
  keys: 0,
  lastResult: "—",
  notice: "",
};
let previous = null;
let metrics = { jump: 0, dw: 0, dh: 0, anchorShift: 0 };

const stage = document.getElementById("stage");
const hud = document.getElementById("hud");
const label = document.getElementById("label");

const app = () => s.apps[s.a];
const win = () => app().windows[s.w];
const wrap = (i, n) => (i + n) % n;
const escapeHtml = (text) => text.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function indicator(a) {
  const n = a.windows.length;
  if (n < 2) return { icon: "", tile: "", iconClass: "" };
  if (s.variant === "B") return { icon: `<span class="badge">${n}</span>`, tile: "", iconClass: "" };
  if (s.variant === "C") return { icon: "", tile: "", iconClass: "stacked" };
  return { icon: "", tile: `<div class="chev">${n} ▾</div>`, iconClass: "" };
}

function tile(a, i, cls = "") {
  const ind = indicator(a);
  const selected = i === s.a && s.level === "app" ? "sel" : "";
  return `<div class="tile ${selected} ${cls}" data-app="${i}">
    <div class="icon-wrap"><div class="icon ${ind.iconClass}" style="background:${a.color}">${a.name[0]}${ind.icon}</div></div>
    <div class="name">${a.name}</div>${ind.tile}</div>`;
}

function windowRow(w, i) {
  const selected = s.level === "window" && i === s.w ? "sel" : "";
  const tag = w.tag ? `<span class="tag">${w.tag}</span>` : "";
  return `<div class="win ${selected}"><span class="t">${escapeHtml(w.t)}</span>${tag}</div>`;
}

const row = () => s.apps.map((a, i) => tile(a, i, s.level === "window" && i === s.a ? "parent" : "")).join("");

const renderVariant = {
  A() {
    const pop = s.level === "window"
      ? `<div class="pop" id="pop" data-bounds>${app().windows.map(windowRow).join("")}</div>` : "";
    return `<div class="panel" data-bounds><div class="row">${row()}</div></div>${pop}`;
  },
  E() {
    const cells = app().windows.map((w, i) => `<div class="gcell ${s.level === "window" && i === s.w ? "sel" : ""}">
      <span class="gtitle">${escapeHtml(w.t)}</span>${w.tag ? `<span class="tag">${w.tag}</span>` : ""}</div>`).join("");
    const pop = s.level === "window" ? `<div class="pop grid" id="pop" data-bounds>${cells}</div>` : "";
    return `<div class="panel" data-bounds><div class="row">${row()}</div></div>${pop}`;
  },
  B() {
    const rows = app().windows.length
      ? app().windows.map(windowRow).join("")
      : `<div class="empty">Nessuna finestra aperta</div>`;
    return `<div class="panel" data-bounds><div class="row">${row()}</div>
      <div class="shelf ${s.level === "app" ? "dim" : ""}">${rows}</div></div>`;
  },
  C() {
    if (s.level === "app") {
      return `<div class="panel fixed-c" data-bounds><div class="row" style="justify-content:center">${row()}</div></div>`;
    }
    const a = app();
    const cards = a.windows.map((w, i) => `<div class="card ${i === s.w ? "sel" : ""}">
      <div class="thumb"></div><div class="t">${escapeHtml(w.t)}</div></div>`).join("");
    return `<div class="panel fixed-c" data-bounds>
      <div class="crumb"><div class="icon" style="background:${a.color}">${a.name[0]}</div>${a.name} · ↑ torna alle app</div>
      <div class="cards">${cards}</div></div>`;
  },
  D() {
    const items = s.apps.map((a, i) => {
      if (s.level !== "window" || i !== s.a) return tile(a, i);
      const chips = a.windows.map((w, wi) =>
        `<div class="chip ${wi === s.w ? "sel" : ""}">${escapeHtml(w.t)}</div>`).join("");
      return `<div class="expanded"><div class="icon" style="background:${a.color}">${a.name[0]}</div><div class="chips">${chips}</div></div>`;
    }).join("");
    return `<div class="panel" data-bounds style="width:max-content"><div class="row">${items}</div></div>`;
  },
};

function placeDropdownUnderSelectedApp() {
  const pop = document.getElementById("pop");
  const anchor = document.querySelector(`[data-app="${s.a}"]`);
  if (!pop || !anchor) return;
  const box = anchor.getBoundingClientRect();
  const gutter = 12;
  const left = Math.max(gutter, Math.min(box.left + box.width / 2 - pop.offsetWidth / 2, innerWidth - pop.offsetWidth - gutter));
  pop.style.left = `${left}px`;
  pop.style.top = `${box.bottom + 18}px`;
}

function measure() {
  const sel = stage.querySelector(".sel");
  const boxes = [...stage.querySelectorAll("[data-bounds]")].map((e) => e.getBoundingClientRect());
  if (!sel || !boxes.length) return;
  const r = sel.getBoundingClientRect();
  const center = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
  const bounds = {
    w: Math.max(...boxes.map((b) => b.right)) - Math.min(...boxes.map((b) => b.left)),
    h: Math.max(...boxes.map((b) => b.bottom)) - Math.min(...boxes.map((b) => b.top)),
  };
  const anchorEl = stage.querySelector(`[data-app="${s.a === 0 ? 1 : 0}"]`);
  const anchor = anchorEl ? anchorEl.getBoundingClientRect().left : null;
  if (previous) {
    metrics = {
      jump: Math.round(Math.hypot(center.x - previous.center.x, center.y - previous.center.y)),
      dw: Math.round(bounds.w - previous.bounds.w),
      dh: Math.round(bounds.h - previous.bounds.h),
      anchorShift: anchor !== null && previous.anchor !== null && previous.a === s.a ? Math.round(Math.abs(anchor - previous.anchor)) : 0,
    };
  }
  previous = { center, bounds, anchor, a: s.a };
  sel.scrollIntoView({ block: "nearest", inline: "nearest" });
}

function renderHud() {
  const selected = s.open
    ? s.level === "window" ? `${app().name} › ${win().t}` : app().name
    : "chiuso";
  const front = s.apps[0];
  const moved = metrics.dw || metrics.dh || metrics.anchorShift;
  hud.innerHTML = `<b>${s.variant}</b> ${VARIANTS[s.variant]}<br />
    livello: <b>${s.open ? s.level : "—"}</b> · tasti: <b>${s.keys}</b><br />
    selezione: <b>${escapeHtml(selected.slice(0, 44))}</b><br />
    salto occhio: <b>${metrics.jump}px</b><br />
    <span class="${moved ? "warn" : ""}">Δ UI: ${metrics.dw}×${metrics.dh}px · app spostate: ${metrics.anchorShift}px</span><br />
    in primo piano: <b>${front.name}</b>${front.windows[0] ? " › " + escapeHtml(front.windows[0].t.slice(0, 30)) : ""}<br />
    ultimo: ${escapeHtml(s.lastResult.slice(0, 80))}${s.notice ? `<br /><span class="warn">${s.notice}</span>` : ""}`;
  label.textContent = `${s.variant} (${VARIANTS[s.variant]})`;
}

function render() {
  if (!s.open) {
    stage.innerHTML = `<div id="hint">Premi <b>⌥ + Tab</b> e tieni premuto ⌥, oppure <b>Tab</b>
      <small>⌘Tab è riservato a macOS: nel browser non è intercettabile</small></div>`;
    previous = null;
    renderHud();
    return;
  }
  stage.innerHTML = renderVariant[s.variant]();
  placeDropdownUnderSelectedApp();
  measure();
  renderHud();
}

function firstWindowIndexOnEnter() {
  const frontmostAppHasOtherWindows = s.a === 0 && app().windows.length > 1;
  return frontmostAppHasOtherWindows ? 1 : 0;
}

function openSwitcher(heldOption, step) {
  s.open = true;
  s.level = "app";
  s.heldOption = heldOption;
  s.a = wrap(step, s.apps.length);
  s.w = 0;
  s.keys = 1;
  s.notice = "";
  metrics = { jump: 0, dw: 0, dh: 0, anchorShift: 0 };
}

function moveApp(step) {
  s.a = wrap(s.a + step, s.apps.length);
}

function enterWindows() {
  if (!app().windows.length) { s.notice = `${app().name}: nessuna finestra`; return; }
  s.level = "window";
  s.w = firstWindowIndexOnEnter();
}

function moveAppKeepingWindowLevel(step) {
  moveApp(step);
  if (app().windows.length) s.w = 0;
  else s.level = "app";
}

const navigateWindows = {
  vertical: {
    ArrowDown() { s.w = Math.min(s.w + 1, app().windows.length - 1); },
    ArrowUp() { if (s.w === 0) s.level = "app"; else s.w -= 1; },
    ArrowLeft() { moveAppKeepingWindowLevel(-1); },
    ArrowRight() { moveAppKeepingWindowLevel(1); },
  },
  grid: {
    ArrowDown() { s.w = Math.min(s.w + GRID_COLUMNS, app().windows.length - 1); },
    ArrowUp() { if (s.w < GRID_COLUMNS) s.level = "app"; else s.w -= GRID_COLUMNS; },
    ArrowLeft() { s.w = Math.max(s.w - 1, 0); },
    ArrowRight() { s.w = Math.min(s.w + 1, app().windows.length - 1); },
  },
  replace: {
    ArrowUp() { s.level = "app"; },
    ArrowLeft() { s.w = wrap(s.w - 1, app().windows.length); },
    ArrowRight() { s.w = wrap(s.w + 1, app().windows.length); },
  },
  accordion: {
    ArrowUp() { s.level = "app"; },
    ArrowLeft() { if (s.w === 0) s.level = "app"; else s.w -= 1; },
    ArrowRight() {
      if (s.w < app().windows.length - 1) { s.w += 1; return; }
      s.level = "app";
      moveApp(1);
    },
  },
};

function navigationModel() {
  if (VERTICAL_WINDOW_LIST.has(s.variant)) return navigateWindows.vertical;
  if (s.variant === "E") return navigateWindows.grid;
  return s.variant === "C" ? navigateWindows.replace : navigateWindows.accordion;
}

function commit() {
  const chosen = app();
  if (s.level === "window") {
    const [w] = chosen.windows.splice(s.w, 1);
    chosen.windows.unshift(w);
    s.lastResult = `alza SOLO «${w.t}»${w.tag ? ` (${w.tag})` : ""}`;
    delete w.tag;
  } else {
    s.lastResult = `attiva ${chosen.name}`;
  }
  s.apps.splice(s.a, 1);
  s.apps.unshift(chosen);
  s.open = false;
}

function handleArrowOrSelection(key) {
  s.notice = "";
  if (key === "Enter") { commit(); return; }
  if (key === "Escape") { s.open = false; s.lastResult = "annullato"; return; }
  if (s.level === "app") {
    if (key === "ArrowLeft") moveApp(-1);
    if (key === "ArrowRight") moveApp(1);
    if (key === "ArrowDown") enterWindows();
    return;
  }
  const action = navigationModel()[key];
  if (action) action();
}

function setVariant(key) {
  s.variant = key;
  params.set("variant", key);
  try { history.replaceState(null, "", `?${params}`); } catch {}
  previous = null;
  metrics = { jump: 0, dw: 0, dh: 0, anchorShift: 0 };
  render();
}

function cycleVariant(step) {
  setVariant(VARIANT_KEYS[wrap(VARIANT_KEYS.indexOf(s.variant) + step, VARIANT_KEYS.length)]);
}

addEventListener("keydown", (e) => {
  if (/^[1-5]$/.test(e.key)) { setVariant(VARIANT_KEYS[Number(e.key) - 1]); return; }
  const handled = ["Tab", "Enter", "Escape", "ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"];
  if (!handled.includes(e.key)) return;
  e.preventDefault();
  if (e.key === "Tab") {
    const step = e.shiftKey ? -1 : 1;
    if (s.open) { s.keys += 1; s.level = "app"; s.notice = ""; moveApp(step); }
    else openSwitcher(e.altKey, step);
    render();
    return;
  }
  if (!s.open) return;
  s.keys += 1;
  handleArrowOrSelection(e.key);
  render();
});

addEventListener("keyup", (e) => {
  if (e.key === "Alt" && s.open && s.heldOption) { commit(); render(); }
});

addEventListener("blur", () => {
  if (s.open && s.heldOption) { s.open = false; s.lastResult = "annullato: focus perso"; render(); }
});

document.getElementById("prev").addEventListener("click", (e) => { cycleVariant(-1); e.currentTarget.blur(); });
document.getElementById("next").addEventListener("click", (e) => { cycleVariant(1); e.currentTarget.blur(); });

render();
</script>
</body>
</html>
