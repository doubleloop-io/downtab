<!doctype html>
<!-- PROTOTYPE, throwaway. Question: does variant A feel native with real icons and the window list dropping
     under the icon? ⌥ stands in for ⌘ because the browser cannot catch ⌘Tab. L cycles the window-count styles. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Downtab Switcher</title>
<style>
  :root {
    --hud: rgba(30, 30, 34, 0.8);
    --line: rgba(255, 255, 255, 0.12);
    --text: #f5f5f7;
    --muted: #a1a1aa;
    --accent: #0a84ff;
    --icon: clamp(56px, 8.6vw, 96px);
    --tile: calc(var(--icon) + 22px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: radial-gradient(circle at 20% 15%, #6c7fa8, transparent 55%),
      radial-gradient(circle at 85% 80%, #8a5f86, transparent 50%), #2b3448;
    color: var(--text);
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: absolute; inset: 0; }

  .panel {
    position: absolute; top: 22vh; left: 50%; transform: translateX(-50%);
    display: flex; gap: 6px; padding: 14px; border-radius: 28px;
    background: var(--hud); border: 1px solid var(--line);
    backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
  }
  .tile {
    width: var(--tile); padding: 11px 0 8px; border-radius: 20px;
    display: flex; flex-direction: column; align-items: center;
  }
  .tile.current { background: rgba(255, 255, 255, 0.2); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12); }
  .tile.current.parent { background: rgba(255, 255, 255, 0.1); }
  .tile img { width: var(--icon); height: var(--icon); display: block; }
  /* Every slot has a fixed height and names are hidden, not removed, so the row never moves.
     macOS icons carry ~8% transparent margin, so a negative offset sits the pill just under the artwork. */
  .tile { position: relative; }
  .slot { height: 18px; margin-top: -2px; display: flex; justify-content: center; }
  .name {
    width: calc(var(--tile) + 30px); height: 18px; margin-top: 3px; text-align: center;
    font-size: 12px; font-weight: 500; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    visibility: hidden;
  }
  .tile.current .name { visibility: visible; }
  .count {
    display: flex; align-items: center; gap: 3px; height: 18px; padding: 0 7px 0 8px; border-radius: 9px;
    background: rgba(255, 255, 255, 0.1); color: var(--muted);
    font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1;
  }
  .count svg { width: 9px; height: 6px; }
  .tile.current .count { color: var(--text); }
  .tile.current.parent .count { background: var(--accent); color: #fff; }

  /* Corner badges are centred on the artwork's corner (~90% of the image box, past the transparent margin). */
  [data-layout="oval"] .slot, [data-layout="circle"] .slot {
    position: absolute; height: auto; margin: 0; transform: translate(-50%, -50%);
    left: calc(11px + var(--icon) * 0.9); top: calc(11px + var(--icon) * 0.9);
  }
  [data-layout="oval"] .name, [data-layout="circle"] .name { margin-top: 4px; }

  [data-layout="oval"] .tile .count {
    height: 22px; border-radius: 11px; font-size: 12.5px; background: #4a4a50; color: #fff;
    box-shadow: 0 0 0 2.5px rgb(40, 40, 45), 0 2px 6px rgba(0, 0, 0, 0.4);
  }
  [data-layout="oval"] .tile.current .count { box-shadow: 0 0 0 2.5px rgb(78, 78, 84), 0 2px 6px rgba(0, 0, 0, 0.4); }
  [data-layout="oval"] .tile.current.parent .count { background: var(--accent); }

  [data-layout="circle"] .tile { --badge: calc(var(--icon) * 0.3); }
  [data-layout="circle"] .tile .count {
    min-width: var(--badge); height: var(--badge); padding: 0 4px; justify-content: center; border-radius: 999px;
    background: #f5f5f7; color: #1c1c1e; font-size: calc(var(--badge) * 0.5);
    box-shadow: inset 0 0 0 3px var(--accent), 0 2px 6px rgba(0, 0, 0, 0.35);
  }
  [data-layout="circle"] .count svg { display: none; }
  [data-layout="circle"] .tile.current.parent .count {
    background: var(--accent); color: #fff; box-shadow: inset 0 0 0 3px #fff, 0 2px 6px rgba(0, 0, 0, 0.35);
  }

  .pop {
    position: absolute; width: 380px; max-width: calc(100vw - 32px); padding: 6px;
    background: rgba(36, 36, 40, 0.92); border: 1px solid var(--line); border-radius: 14px;
    backdrop-filter: blur(30px) saturate(1.6); -webkit-backdrop-filter: blur(30px) saturate(1.6);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
    transition: left 0.12s ease-out; animation: drop 0.14s ease-out;
  }
  @keyframes drop { from { opacity: 0; transform: translateY(-6px); } }
  .caret {
    position: absolute; top: -8px; width: 16px; height: 16px; margin-left: -8px; transform: rotate(45deg);
    background: rgb(44, 44, 49); border-left: 1px solid var(--line); border-top: 1px solid var(--line);
    border-radius: 3px 0 0 0; transition: left 0.12s ease-out;
  }
  .pop-head { display: flex; align-items: center; gap: 7px; padding: 4px 8px 6px; color: var(--muted); font-size: 11.5px; }
  .pop-head img { width: 16px; height: 16px; }
  .list { max-height: 300px; overflow: auto; }
  .win { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: 8px; white-space: nowrap; }
  .win .t { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .win .tag { font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
  .win.min .t { color: var(--muted); }
  .win.sel { background: var(--accent); }
  .win.sel .t { color: #fff; }
  .win.sel .tag { color: #fff; border-color: rgba(255, 255, 255, 0.5); }


  /* PROTOTYPE, long app names: N cycles how the selected app's name fits its tile (?names= in the URL). */
  [data-names="truncate"] .name { width: calc(var(--tile) - 12px); }
  [data-names="two-lines"] .name {
    width: calc(var(--tile) - 8px); height: 32px; line-height: 16px; white-space: normal; text-wrap: balance;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  [data-names="grow"] .tile.current { background: none; box-shadow: none; }
  [data-names="grow"] .tile.current::before {
    content: ""; position: absolute; z-index: -1; top: 0; bottom: 0; border-radius: 20px;
    left: calc(-1 * var(--grow, 0px)); right: calc(-1 * var(--grow, 0px));
    background: rgba(255, 255, 255, 0.2); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
  }
  [data-names="grow"] .panel { isolation: isolate; }
  [data-names="grow"] .name { width: max-content; max-width: 260px; }
  /* E: the tile wraps only the icon, so it gets more room and the badge sits further in to keep a margin. */
  [data-names="below"] .tile { --tile: calc(var(--icon) + 28px); padding: 14px 0; }
  [data-names="below"][data-layout="circle"] .slot {
    left: calc(14px + var(--icon) * 0.86); top: calc(14px + var(--icon) * 0.86);
  }
  [data-names="below"] .panel { padding-bottom: 40px; }
  [data-names="below"] .name {
    position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
    width: max-content; max-width: 260px; margin: 0; font-size: 13px;
  }
  #names-bar {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 4px;
    padding: 4px; border-radius: 999px; background: #fde047; color: #111; font-size: 12px; font-weight: 600;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
  }
  #names-bar button {
    border: 0; border-radius: 999px; width: 26px; height: 26px; background: rgba(0, 0, 0, 0.1); color: inherit;
    font: inherit; cursor: pointer;
  }
  #names-bar span { min-width: 250px; text-align: center; }
  #hint { position: absolute; top: 24vh; left: 0; right: 0; text-align: center; font-size: 16px; text-shadow: 0 1px 8px rgba(0, 0, 0, 0.7); }
  #hint small { display: block; margin-top: 6px; font-size: 12px; opacity: 0.8; }
  #help {
    position: fixed; right: 16px; bottom: 16px; width: 310px; padding: 10px 12px; border-radius: 10px;
    background: rgba(10, 10, 12, 0.88); color: #d4d4d8; font-size: 11.5px; line-height: 1.6;
  }
  #help b { color: #fff; }
  #help .last { margin-top: 6px; padding-top: 6px; border-top: 1px solid #27272a; color: #a1a1aa; }
  kbd { font: inherit; color: #fff; background: #27272a; border-radius: 4px; padding: 0 4px; }
  @media (max-width: 760px) { #help { display: none; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="help"></div>
<div id="names-bar"><button data-step="-1" aria-label="Previous">‹</button><span></span><button data-step="1" aria-label="Next">›</button></div>

<script>
const CHEVRON = `<svg viewBox="0 0 9 6" aria-hidden="true"><path d="M1 1.2 4.5 4.7 8 1.2" fill="none"
  stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>`;
const LAYOUTS = ["pill under the icon", "oval", "circle"];
const NAME_FITS = [
  { key: "overhang", label: "A · overhang the tile (current app)" },
  { key: "truncate", label: "B · truncate inside the tile" },
  { key: "two-lines", label: "C · wrap on two lines" },
  { key: "grow", label: "D · highlight grows to fit the name" },
  { key: "below", label: "E · name below the row, icon-only highlight" },
];
const initialNames = new URLSearchParams(location.search).get("names");

// Apps in MRU order: index 0 is the frontmost one.
const apps = [
  { name: "Visual Studio Code", icon: "vscode", windows: [
    { t: "app-ideas — prototype-switcher.html" }, { t: "fitview — CONTEXT.md" }, { t: "recipe-app — goal.md" },
    { t: "trail-running-races — arch-choices.md" }, { t: "dotfiles — .zshrc" },
    { t: "client-api — orders.service.ts" }, { t: "scratch — Untitled-4", min: true },
  ]},
  { name: "Google Chrome", icon: "chrome", windows: [
    { t: "GitHub — Pull requests assigned to me and a very long tab title that must be truncated" },
    { t: "intervals.icu — Calendar" }, { t: "Google Docs — Q4 proposal" },
  ]},
  { name: "iTerm", icon: "iterm", windows: [{ t: "~/projects/iacoware — zsh" }, { t: "ssh staging — htop" }] },
  { name: "Slack", icon: "slack", windows: [{ t: "#general — doubleloop" }] },
  { name: "Miro", icon: "miro", windows: [{ t: "Switcher explorations" }, { t: "November retro" }] },
  { name: "Mail", icon: "mail", windows: [{ t: "Inbox — 12 messages", min: true }] },
  { name: "Music", icon: "music", windows: [{ t: "Music" }] },
  { name: "Finder", icon: "finder", windows: [] },
];

const s = {
  open: false, level: "app", a: 0, w: 0, heldOption: false, layout: "circle", last: "—",
  names: NAME_FITS.some((f) => f.key === initialNames) ? initialNames : NAME_FITS[0].key,
};

const stage = document.getElementById("stage");
const help = document.getElementById("help");

const app = () => apps[s.a];
const wrap = (i, n) => ((i % n) + n) % n;
const iconSrc = (a) => `prototype-icons/${a.icon}.png`;
const escapeHtml = (text) => text.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

function tile(a, i) {
  const n = a.windows.length;
  const count = n > 1 ? `<span class="count">${n}${CHEVRON}</span>` : "";
  return `<div class="tile" data-app="${i}"><img src="${iconSrc(a)}" alt="" />
    <div class="slot">${count}</div><div class="name">${escapeHtml(a.name)}</div></div>`;
}

function windowRow(w) {
  const tag = w.min ? `<span class="tag">Minimized</span>` : "";
  return `<div class="win ${w.min ? "min" : ""}"><span class="t">${escapeHtml(w.t)}</span>${tag}</div>`;
}

function popoverContent(a) {
  const n = a.windows.length;
  return `<div class="caret"></div>
    <div class="pop-head"><img src="${iconSrc(a)}" alt="" />${escapeHtml(a.name)} · ${n} ${n === 1 ? "window" : "windows"}</div>
    <div class="list">${a.windows.map(windowRow).join("")}</div>`;
}

// Rebuild DOM only when its structure changes; selection is applied as classes so nothing re-animates.
function ensurePanel() {
  const key = apps.map((a) => a.icon).join();
  let panel = stage.querySelector(".panel");
  if (panel?.dataset.key === key) return panel;
  stage.innerHTML = `<div class="panel" data-key="${key}">${apps.map(tile).join("")}</div>`;
  return stage.querySelector(".panel");
}

function ensurePopover() {
  let pop = stage.querySelector(".pop");
  if (s.level !== "window") { pop?.remove(); return null; }
  if (!pop) {
    pop = document.createElement("div");
    pop.className = "pop";
    stage.append(pop);
  }
  if (pop.dataset.app !== app().icon) {
    pop.dataset.app = app().icon;
    pop.innerHTML = popoverContent(app());
  }
  return pop;
}

function placePopover(pop, panel) {
  const icon = panel.querySelector(`[data-app="${s.a}"] img`).getBoundingClientRect();
  const gutter = 16;
  const center = icon.left + icon.width / 2;
  const left = Math.max(gutter, Math.min(center - pop.offsetWidth / 2, innerWidth - pop.offsetWidth - gutter));
  pop.style.left = `${left}px`;
  pop.style.top = `${panel.getBoundingClientRect().bottom + 14}px`;
  pop.querySelector(".caret").style.left = `${center - left}px`;
}

function renderHelp() {
  help.innerHTML = `<b>Keys</b> (⌥ instead of ⌘)<br />
    <kbd>⌥ Tab</kbd> next app · releasing <kbd>⌥</kbd> confirms<br />
    <kbd>↓</kbd> opens the windows · <kbd>← →</kbd> other app<br />
    <kbd>↑</kbd> from the first window goes back to the apps<br />
    <kbd>Esc</kbd> cancels everything<br />
    <kbd>⌥ \`</kbd> windows of the active app (also <kbd>⌥ \\</kbd>)<br />
    <kbd>L</kbd> window count: <b>${s.layout}</b><br />
    <kbd>N</kbd> long names: <b>${s.names}</b>
    <div class="last">last: ${escapeHtml(s.last.slice(0, 90))}</div>`;
}

function cycleNames(step) {
  const i = NAME_FITS.findIndex((f) => f.key === s.names);
  s.names = NAME_FITS[wrap(i + step, NAME_FITS.length)].key;
  const url = new URL(location.href);
  url.searchParams.set("names", s.names);
  history.replaceState(null, "", url);
}

function renderNamesBar() {
  document.querySelector("#names-bar span").textContent = NAME_FITS.find((f) => f.key === s.names).label;
}

// Variant D: widen the highlight just enough to wrap the name, without moving the icons.
function growHighlight(panel) {
  panel.querySelectorAll(".tile").forEach((el) => el.style.removeProperty("--grow"));
  if (s.names !== "grow") return;
  const tileEl = panel.querySelector(".tile.current");
  const name = tileEl.querySelector(".name");
  const extra = Math.max(0, (name.offsetWidth + 20 - tileEl.offsetWidth) / 2);
  tileEl.style.setProperty("--grow", `${extra}px`);
}

function render() {
  document.body.dataset.layout = s.layout;
  document.body.dataset.names = s.names;
  renderNamesBar();
  renderHelp();
  if (!s.open) {
    stage.innerHTML = `<div id="hint">Hold <b>⌥</b> and press <b>Tab</b>
      <small>⌘Tab is reserved by macOS: the browser simulates it with ⌥</small></div>`;
    return;
  }
  const panel = ensurePanel();
  panel.querySelectorAll(".tile").forEach((el, i) => {
    el.classList.toggle("current", i === s.a);
    el.classList.toggle("parent", i === s.a && s.level === "window");
  });
  growHighlight(panel);
  const pop = ensurePopover();
  if (!pop) return;
  pop.querySelectorAll(".win").forEach((el, i) => el.classList.toggle("sel", i === s.w));
  placePopover(pop, panel);
  pop.querySelector(".sel")?.scrollIntoView({ block: "nearest" });
}

function openAt(index, heldOption) {
  Object.assign(s, { open: true, level: "app", a: wrap(index, apps.length), w: 0, heldOption });
}

// The frontmost app's first window is the one you are leaving, so skip it.
const firstWindowOnEnter = () => (s.a === 0 && app().windows.length > 1 ? 1 : 0);

function enterWindows() {
  if (!app().windows.length) return;
  s.level = "window";
  s.w = firstWindowOnEnter();
}

function moveApp(step) {
  s.a = wrap(s.a + step, apps.length);
  if (s.level !== "window") return;
  if (app().windows.length) s.w = firstWindowOnEnter();
  else s.level = "app";
}

const cycleWindow = (step) => { s.w = wrap(s.w + step, app().windows.length); };

function onTab(step, altKey) {
  if (!s.open) openAt(step, altKey);
  else { s.level = "app"; moveApp(step); }
}

function onWindowCycleKey(step) {
  if (!s.open) { openAt(0, true); enterWindows(); }
  else if (s.level === "app") enterWindows();
  else cycleWindow(step);
}

function cancel(reason) {
  s.open = false;
  s.last = reason;
}

function onArrow(key) {
  if (key === "ArrowLeft") moveApp(-1);
  if (key === "ArrowRight") moveApp(1);
  if (key === "ArrowDown") {
    if (s.level === "app") enterWindows();
    else s.w = Math.min(s.w + 1, app().windows.length - 1);
  }
  if (key === "ArrowUp" && s.level === "window") {
    if (s.w === 0) s.level = "app";
    else s.w -= 1;
  }
}

function commit() {
  const chosen = app();
  if (s.level === "window") {
    const [w] = chosen.windows.splice(s.w, 1);
    s.last = `raise only «${w.t}»${w.min ? " (restored)" : ""}`;
    delete w.min;
    chosen.windows.unshift(w);
  } else {
    s.last = `activate ${chosen.name}`;
  }
  apps.splice(s.a, 1);
  apps.unshift(chosen);
  s.open = false;
}

// Physical key left of 1 (Backquote on ANSI, IntlBackslash on ISO), so ⌥ dead keys don't matter.
const isWindowCycleKey = (e) => e.code === "Backquote" || e.code === "IntlBackslash";

addEventListener("keydown", (e) => {
  const step = e.shiftKey ? -1 : 1;
  if (e.code === "KeyN" && !e.altKey && !e.metaKey) {
    cycleNames(step);
  } else if (e.code === "KeyL" && !e.altKey && !e.metaKey) {
    s.layout = LAYOUTS[wrap(LAYOUTS.indexOf(s.layout) + 1, LAYOUTS.length)];
  } else if (isWindowCycleKey(e) && e.altKey) {
    onWindowCycleKey(step);
  } else if (e.key === "Tab") {
    onTab(step, e.altKey);
  } else if (s.open && e.key === "Enter") {
    commit();
  } else if (s.open && e.key === "Escape") {
    cancel("cancelled");
  } else if (s.open && e.key.startsWith("Arrow")) {
    onArrow(e.key);
  } else {
    return;
  }
  e.preventDefault();
  render();
});

addEventListener("keyup", (e) => {
  if (e.key === "Alt" && s.open && s.heldOption) { commit(); render(); }
});

addEventListener("blur", () => {
  if (s.open && s.heldOption) { cancel("cancelled: focus lost"); render(); }
});

addEventListener("resize", () => { if (s.open) render(); });

document.getElementById("names-bar").addEventListener("click", (e) => {
  const step = Number(e.target.closest("button")?.dataset.step);
  if (!step) return;
  cycleNames(step);
  render();
});

render();
</script>
</body>
</html>
